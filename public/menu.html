<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#f7f4ec" />
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* =========================================================================
   Menu digitale — pagina pubblica, self-contained come prenota.html: nessun
   asset del CRM, token --ds-* restati qui (§16 del design system). La pagina
   è bloccata sul tema chiaro di proposito: la legge l'ospite del ristorante
   e un tema scuro automatico la ribalterebbe sotto i piedi.
   ========================================================================= */
:root {
    --ds-surface: #ffffff;
    --ds-surface-row: #f4f4f5;
    --ds-border: #e9e9ec;
    --ds-border-focus: #5250c9;

    --ds-text-primary: #111113;
    --ds-text-secondary: #52525b;
    --ds-text-muted: #6f6f78;
    --ds-text-subtle: #a1a1aa;

    --ds-action-bg: #111827;
    --ds-action-fg: #ffffff;

    --ds-shadow-card: 0 1px 2px rgba(16, 17, 25, 0.04), 0 12px 32px -14px rgba(16, 17, 25, 0.12);

    --ds-public-canvas: #f7f4ec;
    --ds-public-font: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --ds-public-wordmark: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;

    /* Solo di questa pagina: il vetro della barra categorie (il canvas al
       semitrasparente, sfocato sotto), la riga che compare quando si
       aggancia, il segnaposto delle foto e il fondo del visore. */
    --menu-glass: rgba(247, 244, 236, 0.84);
    --menu-hairline: rgba(17, 17, 19, 0.08);
    --menu-placeholder: #ece8de;
    --menu-scrim: rgba(10, 10, 12, 0.9);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    font-family: var(--ds-public-font);
    font-size: 15px;
    line-height: 1.5;
    color: var(--ds-text-primary);
    background: var(--ds-public-canvas);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--ds-border-focus); outline-offset: 2px; border-radius: 4px; }
.tnum { font-variant-numeric: tabular-nums; }
.sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
[hidden] { display: none !important; }

/* --- Testata -------------------------------------------------------------
   Chiara e centrata sul marchio. Chiara non per gusto: il logo che il
   ristoratore carica sempre è la variante per fondo chiaro (quello del
   Frantoio è inchiostro nero su trasparente) e su una testata scura
   sparirebbe. */
.hero {
    padding: 12px 16px 28px;
    padding-top: max(12px, env(safe-area-inset-top));
    background: radial-gradient(120% 90% at 50% 0%, #fffdf7 0%, var(--ds-public-canvas) 72%);
}
.hero__bar { max-width: 760px; margin: 0 auto; display: flex; justify-content: flex-end; }
.hero__brand {
    max-width: 760px; margin: 0 auto; padding: 12px 8px 0;
    min-height: 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
}
.hero__logo {
    height: 76px; width: auto; max-width: min(260px, 72vw); object-fit: contain; display: block;
    opacity: 0; transition: opacity 0.35s ease;
}
.hero__logo.is-pronto { opacity: 1; }
.hero__name {
    font-family: var(--ds-public-wordmark); font-weight: 600;
    font-size: 34px; line-height: 1.1; letter-spacing: -0.005em;
    margin: 0; text-wrap: balance;
}
/* Logo e nome insieme raddoppierebbero il marchio (come in prenota): col
   logo il nome resta solo per gli screen reader, e la tagline esce — il
   logo del Frantoio la porta già scritta sotto. */
.hero.con-logo .hero__name {
    position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
}
.hero.con-logo .hero__tagline { display: none; }
.hero__tagline {
    margin: 10px 0 0; font-size: 13px; letter-spacing: 0.06em; color: var(--ds-text-muted);
}

/* Lingua: un <select> nativo sotto una pillola. Sul telefono apre il
   selettore di sistema — più grande e più familiare di quattro bottoni. */
.lingua {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 12px 0 10px; border-radius: 999px;
    background: rgba(17, 17, 19, 0.05); color: var(--ds-text-secondary);
    font-size: 13px; font-weight: 600;
}
.lingua svg { width: 16px; height: 16px; flex-shrink: 0; }
.lingua__chevron { width: 14px !important; height: 14px !important; opacity: 0.6; }
.lingua select {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; font-size: 16px; /* 16px: iOS non zooma */
    -webkit-appearance: none; appearance: none; border: 0;
}
.lingua:focus-within { outline: 2px solid var(--ds-border-focus); outline-offset: 2px; }

/* --- Barra categorie -----------------------------------------------------
   Si aggancia in alto e segue la lettura: la categoria sotto gli occhi è
   quella piena, e la barra scorre da sola per tenerla in vista. */
.catnav {
    position: sticky; top: 0; z-index: 10;
    background: var(--menu-glass);
    -webkit-backdrop-filter: saturate(1.6) blur(16px);
    backdrop-filter: saturate(1.6) blur(16px);
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.catnav.is-stuck { border-bottom-color: var(--menu-hairline); box-shadow: 0 10px 24px -20px rgba(16, 17, 25, 0.35); }
.catnav__inner {
    position: relative; /* offsetParent delle pillole, per centrarle */
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 4px; padding: 8px 16px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16px, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 16px, #000 calc(100% - 28px), transparent 100%);
}
.catnav__inner::-webkit-scrollbar { display: none; }
.catnav a {
    flex: none; display: inline-flex; align-items: center;
    height: 40px; padding: 0 16px; border-radius: 999px;
    white-space: nowrap; text-decoration: none;
    font-size: 14px; font-weight: 600; color: var(--ds-text-muted);
    transition: background-color 0.2s ease, color 0.2s ease;
}
.catnav a[aria-current="true"] { background: var(--ds-text-primary); color: #ffffff; }

/* --- Sezioni e piatti ---------------------------------------------------- */
main { max-width: 760px; margin: 0 auto; padding: 4px 16px 48px; }
.sezione { margin-top: 28px; }
.sezione h2 {
    font-family: var(--ds-public-wordmark); font-size: 30px; font-weight: 600;
    line-height: 1.1; letter-spacing: -0.005em;
    margin: 0 4px 14px; scroll-margin-top: 72px;
}
.card { background: var(--ds-surface); border-radius: 20px; box-shadow: var(--ds-shadow-card); overflow: hidden; }

/* Testo a sinistra, foto a destra, prezzo in fondo al testo: lo schema
   che l'ospite conosce dalle app di consegna, e la foto non spinge il
   nome fuori asse quando c'è in una riga e nell'altra no. */
.piatto { position: relative; display: flex; gap: 16px; padding: 18px; }
.piatto + .piatto::before {
    content: ''; position: absolute; top: 0; left: 18px; right: 18px;
    height: 1px; background: var(--ds-border);
}
.piatto__testo { flex: 1; min-width: 0; }
.piatto__nome { font-weight: 600; font-size: 16px; line-height: 1.3; letter-spacing: -0.005em; }
.piatto__desc { color: var(--ds-text-secondary); font-size: 14px; line-height: 1.45; margin-top: 4px; }
/* Allergeni e vini in --ds-text-muted, non subtle: sono informazioni che
   l'ospite cerca, e il grigio chiaro sul bianco non passava il contrasto. */
.piatto__meta {
    display: flex; gap: 6px; align-items: flex-start;
    color: var(--ds-text-muted); font-size: 12.5px; line-height: 1.4; margin-top: 8px;
}
.piatto__meta + .piatto__meta { margin-top: 4px; }
.piatto__meta svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }
.piatto__abbinati { font-style: italic; }
.piatto__prezzo { font-weight: 600; font-size: 15px; margin-top: 10px; }

.piatto__foto {
    flex: none; align-self: flex-start;
    width: 96px; height: 96px; border-radius: 14px; overflow: hidden;
    background: var(--menu-placeholder); cursor: zoom-in;
}
.piatto__foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.piatto__foto:focus-visible { border-radius: 14px; }

@media (min-width: 640px) {
    .piatto { padding: 20px 22px; gap: 20px; }
    .piatto + .piatto::before { left: 22px; right: 22px; }
    .piatto__foto { width: 112px; height: 112px; }
}

/* Primo caricamento: le sezioni salgono in sequenza. Solo la prima volta —
   al cambio lingua il contenuto resta fermo sotto gli occhi. */
.anima .sezione { animation: sale 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.anima .sezione:nth-child(2) { animation-delay: 0.05s; }
.anima .sezione:nth-child(3) { animation-delay: 0.1s; }
.anima .sezione:nth-child(n+4) { animation-delay: 0.15s; }
@keyframes sale { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* --- Attesa e stati ------------------------------------------------------ */
.scheletro__titolo { width: 132px; height: 26px; border-radius: 8px; margin: 28px 4px 16px; }
.scheletro__riga { display: flex; gap: 16px; padding: 18px; }
.scheletro__riga + .scheletro__riga { border-top: 1px solid var(--ds-border); }
.scheletro__testo { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.scheletro__testo span { height: 12px; border-radius: 6px; }
.scheletro__testo span:first-child { width: 55%; height: 15px; }
.scheletro__testo span:nth-child(2) { width: 85%; }
.scheletro__testo span:nth-child(3) { width: 28%; margin-top: 6px; }
.scheletro__foto { width: 96px; height: 96px; border-radius: 14px; flex: none; }
.scheletro__titolo, .scheletro__testo span, .scheletro__foto {
    background: linear-gradient(90deg, var(--menu-placeholder) 0%, #f4f1ea 50%, var(--menu-placeholder) 100%);
    background-size: 200% 100%;
    animation: luccica 1.4s ease-in-out infinite;
}
@keyframes luccica { from { background-position: 100% 0; } to { background-position: -100% 0; } }

.stato {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center; color: var(--ds-text-muted); padding: 64px 24px;
}
.stato svg { width: 40px; height: 40px; color: var(--ds-text-subtle); }
.stato p { margin: 0; max-width: 320px; }

footer {
    text-align: center; color: var(--ds-text-muted);
    font-family: var(--ds-public-wordmark); font-size: 18px; font-weight: 600;
    padding: 8px 20px 48px; padding-bottom: max(48px, calc(env(safe-area-inset-bottom) + 24px));
}

/* --- Visore foto ---------------------------------------------------------
   Fondo scuro pieno come sul palmare: la foto ha il palco, sotto solo nome
   e prezzo. Un tocco ovunque chiude; la X c'è per chi non lo sa. */
.fotovelo {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    padding: 24px 20px; padding-bottom: max(24px, env(safe-area-inset-bottom));
    background: var(--menu-scrim);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    cursor: zoom-out;
    animation: velo 0.22s ease-out both;
}
.fotovelo img {
    max-height: 70vh; max-width: min(100%, 720px); border-radius: 22px; object-fit: contain;
    box-shadow: 0 30px 80px -24px rgba(0, 0, 0, 0.7);
    animation: foto 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.fotovelo__nome { font-size: 20px; font-weight: 600; color: #ffffff; text-align: center; line-height: 1.3; }
.fotovelo__prezzo { font-size: 16px; color: rgba(255, 255, 255, 0.7); margin-top: 4px; text-align: center; }
.fotovelo__chiudi {
    position: absolute; right: 16px; top: max(16px, env(safe-area-inset-top));
    width: 44px; height: 44px; border-radius: 999px;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.14); color: #ffffff;
}
.fotovelo__chiudi svg { width: 18px; height: 18px; }
@keyframes velo { from { opacity: 0; } to { opacity: 1; } }
@keyframes foto { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="hero" id="hero">
    <div class="hero__bar">
        <label class="lingua">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            <span id="lingua-nome"></span>
            <svg class="lingua__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            <select id="lingua"></select>
        </label>
    </div>
    <div class="hero__brand">
        <img class="hero__logo" id="logo" alt="" hidden />
        <h1 class="hero__name" id="nome-ristorante">&nbsp;</h1>
        <p class="hero__tagline" id="tagline" hidden></p>
    </div>
</header>

<nav class="catnav" id="catnav" hidden><div class="catnav__inner" id="catnav-inner"></div></nav>

<main id="main" aria-busy="true">
    <div aria-hidden="true">
        <div class="scheletro__titolo"></div>
        <div class="card">
            <div class="scheletro__riga"><div class="scheletro__testo"><span></span><span></span><span></span></div><div class="scheletro__foto"></div></div>
            <div class="scheletro__riga"><div class="scheletro__testo"><span></span><span></span><span></span></div></div>
            <div class="scheletro__riga"><div class="scheletro__testo"><span></span><span></span><span></span></div><div class="scheletro__foto"></div></div>
        </div>
    </div>
</main>

<footer id="footer"></footer>

<script>
'use strict';
(function () {
    /* Testi della pagina nelle quattro lingue del menu. I piatti usano le
       traduzioni del CRM quando ci sono, altrimenti restano in italiano. */
    var UI = {
        it: { lingua: 'Lingua', categorie: 'Categorie', foto: 'Foto', chiudi: 'Chiudi', allergeni: 'Allergeni', abbinati: 'Si abbina con', vuoto: 'Il menu non è al momento disponibile.', errore: 'Non riusciamo a caricare il menu. Riprova tra poco.' },
        en: { lingua: 'Language', categorie: 'Categories', foto: 'Photo', chiudi: 'Close', allergeni: 'Allergens', abbinati: 'Pairs with', vuoto: 'The menu is not available right now.', errore: 'We could not load the menu. Please try again shortly.' },
        fr: { lingua: 'Langue', categorie: 'Catégories', foto: 'Photo', chiudi: 'Fermer', allergeni: 'Allergènes', abbinati: 'S’accorde avec', vuoto: 'Le menu n’est pas disponible pour le moment.', errore: 'Impossible de charger le menu. Réessayez dans un instant.' },
        de: { lingua: 'Sprache', categorie: 'Kategorien', foto: 'Foto', chiudi: 'Schließen', allergeni: 'Allergene', abbinati: 'Passt zu', vuoto: 'Die Speisekarte ist derzeit nicht verfügbar.', errore: 'Die Speisekarte konnte nicht geladen werden. Bitte versuche es gleich noch einmal.' }
    };
    // Ogni lingua col suo nome: chi cerca la propria la riconosce così.
    var NOME_LINGUA = { it: 'Italiano', en: 'English', fr: 'Français', de: 'Deutsch' };

    /* Gli allergeni nel CRM sono i 14 nomi UE in italiano (COMMON_ALLERGENS in
       types.ts): la traduzione è un dizionario fisso, nei nomi ufficiali
       dell'allegato II del Reg. UE 1169/2011. Un valore fuori elenco resta
       com'è — meglio in italiano che sparito. */
    var ALLERGENI = {
        'glutine':         { en: 'Gluten',      fr: 'Gluten',          de: 'Gluten' },
        'crostacei':       { en: 'Crustaceans', fr: 'Crustacés',       de: 'Krebstiere' },
        'uova':            { en: 'Eggs',        fr: 'Œufs',            de: 'Eier' },
        'pesce':           { en: 'Fish',        fr: 'Poisson',         de: 'Fisch' },
        'arachidi':        { en: 'Peanuts',     fr: 'Arachides',       de: 'Erdnüsse' },
        'soia':            { en: 'Soy',         fr: 'Soja',            de: 'Soja' },
        'latte':           { en: 'Milk',        fr: 'Lait',            de: 'Milch' },
        'frutta a guscio': { en: 'Tree nuts',   fr: 'Fruits à coque',  de: 'Schalenfrüchte' },
        'sedano':          { en: 'Celery',      fr: 'Céleri',          de: 'Sellerie' },
        'senape':          { en: 'Mustard',     fr: 'Moutarde',        de: 'Senf' },
        'sesamo':          { en: 'Sesame',      fr: 'Sésame',          de: 'Sesam' },
        'solfiti':         { en: 'Sulphites',   fr: 'Sulfites',        de: 'Sulfite' },
        'lupini':          { en: 'Lupin',       fr: 'Lupin',           de: 'Lupinen' },
        'molluschi':       { en: 'Molluscs',    fr: 'Mollusques',      de: 'Weichtiere' }
    };

    /* L'ordine delle portate non è alfabetico: si mangia in quest'ordine. Le
       categorie fuori elenco vanno in coda, in ordine di nome. */
    var ORDINE = ['antipast', 'primi', 'second', 'griglia', 'contorn', 'senza glutine', 'frutta', 'gelat', 'dessert', 'dolc', 'menu', 'bibite', 'vini bianchi', 'vini ross', 'vino', 'caff', 'liquor'];
    function pesoCategoria(nome) {
        var n = String(nome).toLowerCase();
        for (var i = 0; i < ORDINE.length; i++) if (n.indexOf(ORDINE[i]) !== -1) return i;
        return ORDINE.length;
    }

    var ICONA = {
        // Cerchio con la «i»: neutro, non un avviso — gli allergeni sono
        // un'informazione, non un pericolo per tutti.
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
        calice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-.5 6a3.5 3.5 0 0 1-7 0L8 3ZM12 12.5V20M8.5 20h7"/></svg>',
        piatto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3.5"/><path d="M3 4v4a2 2 0 0 0 2 2V20M5 4v4M21 4c-1.5 1-2 3-2 5h2v11"/></svg>',
        chiudi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
    };

    var slugMatch = location.pathname.match(/^\/m\/([^/]+)/);
    var apiPath = slugMatch ? '/public/' + slugMatch[1] + '/menu' : '/public/menu';

    var lang = null;
    try { lang = localStorage.getItem('menu_lang'); } catch (e) { /* storage bloccato: si va col browser */ }
    if (!lang || !UI[lang]) {
        var nav = (navigator.language || 'it').slice(0, 2).toLowerCase();
        lang = UI[nav] ? nav : 'it';
    }
    var riduciMoto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var dati = null;
    var primoRender = true;
    var main = document.getElementById('main');
    var catnav = document.getElementById('catnav');
    var navBox = document.getElementById('catnav-inner');

    function t(chiave) { return UI[lang][chiave]; }
    function euro(n) {
        // La valuta arriva col menu: fino a quel momento (e se manca) l'euro,
        // che è dove l'applicazione ha sempre vissuto.
        var valuta = (dati && dati.currency) || 'EUR';
        return new Intl.NumberFormat(lang === 'it' ? 'it-IT' : lang, { style: 'currency', currency: valuta }).format(n);
    }
    function testoPiatto(p) {
        var tr = p.translations && p.translations[lang];
        return {
            nome: (lang !== 'it' && tr && tr.name) ? tr.name : p.name,
            desc: (lang !== 'it' && tr && tr.description) ? tr.description : (p.description || '')
        };
    }
    function nomeAllergene(a) {
        var tr = ALLERGENI[String(a).trim().toLowerCase()];
        return (lang !== 'it' && tr && tr[lang]) || a;
    }
    function nomeCategoria(cat) {
        var tr = dati.categorie && dati.categorie[cat];
        return (lang !== 'it' && tr && tr[lang]) ? tr[lang] : cat;
    }
    function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }

    function mostraStato(testo) {
        main.removeAttribute('aria-busy');
        main.innerHTML = '<div class="stato" role="status">' + ICONA.piatto + '<p>' + esc(testo) + '</p></div>';
    }

    function renderLangs() {
        var sel = document.getElementById('lingua');
        if (!sel.options.length) {
            Object.keys(UI).forEach(function (l) {
                var o = document.createElement('option');
                o.value = l;
                o.textContent = NOME_LINGUA[l];
                sel.appendChild(o);
            });
            sel.addEventListener('change', function () {
                lang = sel.value;
                try { localStorage.setItem('menu_lang', lang); } catch (e) { /* solo per la prossima visita */ }
                document.documentElement.lang = lang;
                renderLangs();
                render();
            });
        }
        sel.value = lang;
        sel.setAttribute('aria-label', t('lingua'));
        document.getElementById('lingua-nome').textContent = NOME_LINGUA[lang];
    }

    function render() {
        catnav.setAttribute('aria-label', t('categorie'));
        if (!dati) return;
        var perCat = {};
        dati.piatti.forEach(function (p) { (perCat[p.category] = perCat[p.category] || []).push(p); });
        /* Prima le categorie ordinate a mano nel CRM (categorie_ordine),
           poi le altre con l'euristica delle portate. */
        var ordineCRM = dati.categorie_ordine || [];
        var cats = Object.keys(perCat).sort(function (a, b) {
            var ia = ordineCRM.indexOf(a), ib = ordineCRM.indexOf(b);
            if (ia !== -1 && ib !== -1) return ia - ib;
            if (ia !== -1) return -1;
            if (ib !== -1) return 1;
            var d = pesoCategoria(a) - pesoCategoria(b);
            return d !== 0 ? d : a.localeCompare(b);
        });

        navBox.innerHTML = '';
        cats.forEach(function (cat, i) {
            var a = document.createElement('a');
            a.href = '#cat-' + i;
            a.textContent = nomeCategoria(cat);
            a.setAttribute('data-i', String(i));
            navBox.appendChild(a);
        });
        catnav.hidden = cats.length < 2;

        var html = '';
        cats.forEach(function (cat, i) {
            html += '<section class="sezione" aria-labelledby="cat-' + i + '"><h2 id="cat-' + i + '">' + esc(nomeCategoria(cat)) + '</h2><div class="card">';
            perCat[cat].forEach(function (p) {
                var tp = testoPiatto(p);
                var prezzo = p.price > 0 ? euro(p.price) : '';
                html += '<div class="piatto">'
                    + '<div class="piatto__testo"><div class="piatto__nome">' + esc(tp.nome) + '</div>'
                    + (tp.desc ? '<div class="piatto__desc">' + esc(tp.desc) + '</div>' : '')
                    + (p.allergens && p.allergens.length ? '<div class="piatto__meta">' + ICONA.info + '<span>' + esc(t('allergeni')) + ': ' + esc(p.allergens.map(nomeAllergene).join(', ')) + '</span></div>' : '')
                    + (p.abbinati && p.abbinati.length ? '<div class="piatto__meta piatto__abbinati">' + ICONA.calice + '<span>' + esc(t('abbinati')) + ': ' + esc(p.abbinati.join(', ')) + '</span></div>' : '')
                    + (prezzo ? '<div class="piatto__prezzo tnum">' + esc(prezzo) + '</div>' : '')
                    + '</div>'
                    + (p.photo_url ? '<button type="button" class="piatto__foto" aria-label="' + esc(t('foto') + ': ' + tp.nome) + '" data-nome="' + esc(tp.nome) + '" data-prezzo="' + esc(prezzo) + '"><img src="' + esc(p.photo_url) + '" alt="" loading="lazy" decoding="async" width="112" height="112" /></button>' : '')
                    + '</div>';
            });
            html += '</div></section>';
        });
        if (!html) { mostraStato(t('vuoto')); return; }
        main.removeAttribute('aria-busy');
        main.classList.toggle('anima', primoRender && !riduciMoto);
        primoRender = false;
        main.innerHTML = html;
        attiva = -1;
        spia();
    }

    /* --- La barra segue la lettura ---------------------------------------
       La categoria «attiva» è l'ultima il cui titolo è passato sotto la
       barra. Dopo un tocco su una pillola la scelta resta quella finché
       l'ospite non scorre di suo: lo scorrimento animato attraversa le
       categorie in mezzo e le farebbe lampeggiare tutte, e in fondo alla
       pagina il titolo scelto può non arrivare mai alla barra. */
    var attiva = -1;
    var scelta = -1;
    var inAttesa = false;

    function segna(idx) {
        if (idx === attiva) return;
        attiva = idx;
        var pillole = navBox.children;
        for (var i = 0; i < pillole.length; i++) pillole[i].setAttribute('aria-current', String(i === idx));
        var p = pillole[idx];
        if (!p || catnav.hidden) return;
        // Scorre solo la barra (scrollLeft), mai la pagina: scrollIntoView
        // su iOS sposta anche la finestra.
        var sinistra = p.offsetLeft - (navBox.clientWidth - p.offsetWidth) / 2;
        navBox.scrollTo({ left: Math.max(0, sinistra), behavior: riduciMoto ? 'auto' : 'smooth' });
    }

    function spia() {
        inAttesa = false;
        if (catnav.hidden) return;
        catnav.classList.toggle('is-stuck', catnav.getBoundingClientRect().top <= 0.5);
        if (scelta !== -1) { segna(scelta); return; }
        var titoli = main.querySelectorAll('.sezione h2');
        if (!titoli.length) return;
        var soglia = catnav.offsetHeight + 24;
        var idx = 0;
        for (var i = 0; i < titoli.length; i++) {
            if (titoli[i].getBoundingClientRect().top <= soglia) idx = i; else break;
        }
        // In fondo alla pagina l'ultima categoria, anche se corta non porta
        // il suo titolo fino alla barra.
        var doc = document.documentElement;
        if (window.scrollY > 0 && window.innerHeight + window.scrollY >= doc.scrollHeight - 2) idx = titoli.length - 1;
        segna(idx);
    }

    window.addEventListener('scroll', function () {
        if (!inAttesa) { inAttesa = true; requestAnimationFrame(spia); }
    }, { passive: true });
    window.addEventListener('resize', spia, { passive: true });
    // Un gesto dell'ospite (dito, rotella, tastiera) rimette la barra a
    // seguire lo scorrimento; quello animato da un tocco non ne genera.
    ['touchstart', 'wheel', 'keydown'].forEach(function (ev) {
        window.addEventListener(ev, function () { scelta = -1; }, { passive: true });
    });

    navBox.addEventListener('click', function (ev) {
        var a = ev.target.closest ? ev.target.closest('a[data-i]') : null;
        if (!a) return;
        ev.preventDefault();
        var i = Number(a.getAttribute('data-i'));
        var titolo = document.getElementById('cat-' + i);
        if (!titolo) return;
        scelta = i;
        segna(i);
        var y = titolo.getBoundingClientRect().top + window.scrollY - catnav.offsetHeight - 12;
        window.scrollTo({ top: Math.max(0, y), behavior: riduciMoto ? 'auto' : 'smooth' });
    });

    /* Il visore foto: si apre dal tocco sulla miniatura, si chiude con un
       tocco ovunque o con Esc. Delegato su document perché le card si
       rirenderizzano a ogni cambio lingua. */
    var apertoDa = null;
    function chiudiFoto() {
        var v = document.getElementById('fotovelo');
        if (!v) return;
        v.remove();
        document.documentElement.style.overflow = '';
        if (apertoDa && document.contains(apertoDa)) apertoDa.focus({ preventScroll: true });
        apertoDa = null;
    }
    document.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.piatto__foto') : null;
        if (!btn) return;
        var img = btn.querySelector('img');
        if (!img) return;
        chiudiFoto();
        apertoDa = btn;
        var velo = document.createElement('div');
        velo.className = 'fotovelo';
        velo.id = 'fotovelo';
        velo.setAttribute('role', 'dialog');
        velo.setAttribute('aria-modal', 'true');
        velo.setAttribute('aria-label', btn.getAttribute('data-nome') || '');
        var chiudi = document.createElement('button');
        chiudi.type = 'button';
        chiudi.className = 'fotovelo__chiudi';
        chiudi.setAttribute('aria-label', t('chiudi'));
        chiudi.innerHTML = ICONA.chiudi;
        velo.appendChild(chiudi);
        var grande = document.createElement('img');
        grande.src = img.currentSrc || img.src;
        grande.alt = btn.getAttribute('data-nome') || '';
        velo.appendChild(grande);
        var testo = document.createElement('div');
        var nome = document.createElement('div');
        nome.className = 'fotovelo__nome';
        nome.textContent = btn.getAttribute('data-nome') || '';
        testo.appendChild(nome);
        if (btn.getAttribute('data-prezzo')) {
            var prezzo = document.createElement('div');
            prezzo.className = 'fotovelo__prezzo tnum';
            prezzo.textContent = btn.getAttribute('data-prezzo');
            testo.appendChild(prezzo);
        }
        velo.appendChild(testo);
        velo.addEventListener('click', chiudiFoto);
        document.body.appendChild(velo);
        // Sotto il visore la pagina non scorre: sul telefono il dito che
        // chiude trascinerebbe il menu.
        document.documentElement.style.overflow = 'hidden';
        chiudi.focus({ preventScroll: true });
    });
    document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') chiudiFoto();
    });
    // Una foto che non scarica (link rotto, file rimosso) toglie la sua
    // miniatura: meglio nessuna foto che un riquadro vuoto da toccare.
    document.addEventListener('error', function (ev) {
        var el = ev.target;
        var btn = el && el.closest ? el.closest('.piatto__foto') : null;
        if (btn) btn.remove();
    }, true);

    document.documentElement.lang = lang;
    renderLangs();
    render();

    fetch(apiPath, { headers: { Accept: 'application/json' } })
        .then(function (r) {
            if (!r.ok) throw new Error(String(r.status));
            return r.json();
        })
        .then(function (json) {
            dati = json;
            var nome = json.restaurant || '';
            // branding manca dal backend di prima del restyling (frontend e
            // backend non escono insieme): senza, la testata resta col nome.
            var branding = json.branding && typeof json.branding === 'object' ? json.branding : {};
            document.getElementById('nome-ristorante').textContent = nome || ' ';
            document.title = (nome ? nome + ' · ' : '') + 'Menu';
            document.getElementById('footer').textContent = nome;
            if (typeof branding.tagline === 'string' && branding.tagline) {
                var tagline = document.getElementById('tagline');
                tagline.textContent = branding.tagline;
                tagline.hidden = false;
            }
            if (typeof branding.logo_url === 'string' && branding.logo_url) {
                // Il nome esce subito, prima che il logo scarichi: sarebbe un
                // lampo di testo sostituito da un'immagine. Se il logo non
                // arriva, il nome torna al suo posto.
                var hero = document.getElementById('hero');
                var logo = document.getElementById('logo');
                hero.classList.add('con-logo');
                logo.addEventListener('load', function () { logo.classList.add('is-pronto'); });
                logo.addEventListener('error', function () { logo.hidden = true; hero.classList.remove('con-logo'); });
                logo.src = branding.logo_url;
                logo.hidden = false;
            }
            render();
        })
        .catch(function (err) {
            mostraStato(err && err.message === '503' ? t('vuoto') : t('errore'));
        });
})();
</script>
</body>
</html>
