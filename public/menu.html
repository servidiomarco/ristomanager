<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#f7f4ec" />
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* =========================================================================
   Menu digitale — pagina pubblica, self-contained come prenota.html: nessun
   asset del CRM, token --ds-* restati qui (§16 del design system). La pagina
   è bloccata sul tema chiaro di proposito: la legge l'ospite del ristorante
   e un tema scuro automatico la ribalterebbe sotto i piedi.
   ========================================================================= */
:root {
    --ds-surface: #ffffff;
    --ds-surface-row: #f4f4f5;
    --ds-border: #e9e9ec;
    --ds-border-focus: #5250c9;

    --ds-text-primary: #111113;
    --ds-text-secondary: #52525b;
    --ds-text-muted: #6f6f78;
    --ds-text-subtle: #a1a1aa;

    --ds-action-bg: #111827;
    --ds-action-fg: #ffffff;

    --ds-public-canvas: #f7f4ec;
    --ds-public-font: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --ds-public-wordmark: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;

    /* Solo di questa pagina: il vetro della barra categorie (il canvas al
       semitrasparente, sfocato sotto), le righe sottili tra i piatti, il
       fondo delle pillole allergeni, il segnaposto delle foto, il lampo sul
       vino raggiunto da un abbinamento e il fondo del visore. */
    --menu-glass: rgba(247, 244, 236, 0.82);
    --menu-hairline: rgba(17, 17, 19, 0.08);
    --menu-chip: rgba(17, 17, 19, 0.05);
    --menu-placeholder: #ece8de;
    --menu-flash: rgba(17, 17, 19, 0.06);
    --menu-scrim: rgba(10, 10, 12, 0.92);
    --menu-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    font-family: var(--ds-public-font);
    font-size: 15px;
    line-height: 1.5;
    color: var(--ds-text-primary);
    background: var(--ds-public-canvas);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--ds-border-focus); outline-offset: 2px; border-radius: 4px; }
.tnum { font-variant-numeric: tabular-nums; }
.sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
[hidden] { display: none !important; }

/* --- Testata -------------------------------------------------------------
   Una riga sola, marchio a sinistra e lingua a destra, come una barra
   d'app: l'ospite ha inquadrato il QR per leggere i piatti, e la prima
   versione — logo grande e centrato — si prendeva un quarto dello schermo
   prima del primo piatto. Chiara non per gusto: il logo che il ristoratore
   carica sempre è la variante per fondo chiaro e su una testata scura
   sparirebbe. */
.hero {
    padding: 10px 16px 4px;
    padding-top: max(10px, env(safe-area-inset-top));
}
.hero__bar {
    max-width: 720px; margin: 0 auto; min-height: 52px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.hero__brand { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
/* multiply: il logo caricato in produzione è un PNG con lo sfondo bianco
   opaco, e sul canvas crema usciva come un riquadro bianco. Moltiplicato,
   il bianco prende il colore del fondo e l'inchiostro resta com'è; un logo
   già trasparente non cambia. */
.hero__logo {
    height: 52px; width: auto; max-width: min(200px, 55vw); object-fit: contain; display: block;
    mix-blend-mode: multiply;
    opacity: 0; transition: opacity 0.35s ease;
}
.hero__logo.is-pronto { opacity: 1; }
/* Il serif resta solo qui, dove fa le veci del logo che manca (§16.5): il
   resto della pagina è grottesco, come l'interfaccia. */
.hero__name {
    font-family: var(--ds-public-wordmark); font-weight: 600;
    font-size: 26px; line-height: 1.1; letter-spacing: -0.005em;
    max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Logo e nome insieme raddoppierebbero il marchio (come in prenota): col
   logo il nome resta solo per gli screen reader, e la tagline esce — il
   logo del Frantoio la porta già scritta sotto. */
.hero.con-logo .hero__name {
    position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
}
.hero.con-logo .hero__tagline { display: none; }
.hero__tagline {
    margin-top: 2px; font-size: 12px; letter-spacing: 0.04em; color: var(--ds-text-muted);
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Dal QR del tavolo: dice all'ospite dove è seduto, anche col logo — è la
   conferma che serve prima di pagare. */
.hero__tavolo {
    margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--ds-text-secondary);
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Lingua: un <select> nativo sotto una pillola. Sul telefono apre il
   selettore di sistema — più grande e più familiare di quattro bottoni. */
.lingua {
    flex: none; position: relative; display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 12px 0 10px; border-radius: 999px;
    background: var(--ds-surface); color: var(--ds-text-primary);
    box-shadow: inset 0 0 0 1px var(--menu-hairline);
    font-size: 13px; font-weight: 600;
}
.lingua svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--ds-text-muted); }
.lingua__chevron { width: 14px !important; height: 14px !important; }
.lingua select {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; font-size: 16px; /* 16px: iOS non zooma */
    -webkit-appearance: none; appearance: none; border: 0;
}
.lingua:focus-within { outline: 2px solid var(--ds-border-focus); outline-offset: 2px; }

/* --- Barra categorie -----------------------------------------------------
   Si aggancia in alto e segue la lettura. La pillola piena è un elemento
   solo che scivola da una categoria all'altra invece di riaccendersi a
   ogni tocco: l'ospite vede dove è andato, non solo dove è arrivato. */
.catnav {
    position: sticky; top: 0; z-index: 10;
    background: var(--menu-glass);
    -webkit-backdrop-filter: saturate(1.6) blur(16px);
    backdrop-filter: saturate(1.6) blur(16px);
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.catnav.is-stuck { border-bottom-color: var(--menu-hairline); box-shadow: 0 10px 24px -20px rgba(16, 17, 25, 0.35); }
.catnav__inner {
    position: relative; /* offsetParent delle pillole, per centrarle */
    max-width: 720px; margin: 0 auto;
    display: flex; padding: 6px 28px 6px 16px; /* a destra quanto la sfumatura */
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16px, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 16px, #000 calc(100% - 28px), transparent 100%);
}
.catnav__inner::-webkit-scrollbar { display: none; }
.catnav a {
    position: relative; z-index: 1;
    flex: none; display: inline-flex; align-items: center;
    height: 44px; padding: 0 14px;
    white-space: nowrap; text-decoration: none;
    font-size: 14px; font-weight: 600; color: var(--ds-text-muted);
    transition: color 0.25s ease;
}
.catnav a[aria-current="true"] { color: var(--ds-action-fg); }
.catnav a:focus-visible { outline-offset: -4px; border-radius: 999px; }
.catnav__pill {
    position: absolute; left: 0; top: 10px; height: 36px; width: 0;
    border-radius: 999px; background: var(--ds-action-bg);
    transition: transform 0.38s var(--menu-ease), width 0.38s var(--menu-ease);
    pointer-events: none;
}
.catnav__pill.is-fermo { transition: none; }

/* --- Sezioni e piatti ----------------------------------------------------
   Niente card: i piatti stanno direttamente sul canvas, separati da una
   riga sottile. Le scatole bianche con l'ombra raddoppiavano i bordi
   intorno a ogni portata e la pagina sembrava un modulo da compilare; le
   foto fanno già da àncora per l'occhio. */
main { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }
.sezione { padding-top: 36px; }
.sezione__testa {
    display: flex; align-items: baseline; gap: 8px;
    padding-bottom: 6px;
}
.sezione h2 {
    font-size: 26px; font-weight: 700; line-height: 1.15; letter-spacing: -0.025em;
    scroll-margin-top: 76px;
}
.sezione__conta { font-size: 14px; font-weight: 600; color: var(--ds-text-subtle); }
.sezione:first-child { padding-top: 20px; }

/* Nome e prezzo sulla stessa riga, come su una carta stampata: al tavolo
   l'ospite legge il menu scorrendo nomi e prezzi, e le bibite e i liquori
   — senza foto né descrizione — tornano una riga ciascuno invece di tre. */
.piatto {
    position: relative; isolation: isolate;
    display: flex; gap: 16px; padding: 18px 0;
    scroll-margin-top: 76px;
}
.piatto + .piatto { border-top: 1px solid var(--menu-hairline); }
/* Bibite e liquori: solo nome e prezzo, una riga stretta come in carta. */
.piatto.is-riga { padding: 13px 0; }
.piatto:focus { outline: none; }
.piatto__testo { flex: 1; min-width: 0; }
.piatto__riga { display: flex; align-items: baseline; gap: 12px; }
.piatto__nome {
    flex: 1; min-width: 0;
    font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em;
}
.piatto__prezzo { flex: none; font-size: 15px; font-weight: 600; white-space: nowrap; }
/* La scheda del vino (cantina · denominazione · vitigno · grado) è la parte
   prima del «—» nella descrizione: si legge da sola, in piccolo, e la nota
   di degustazione sotto può restare chiusa senza perdere niente di utile. */
.piatto__scheda { font-size: 13px; line-height: 1.4; color: var(--ds-text-muted); margin-top: 3px; }
.piatto__desc { font-size: 14px; line-height: 1.5; color: var(--ds-text-secondary); margin-top: 4px; }
.piatto__desc.is-chiusa {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
}
/* Bersaglio di 44px senza spostare il testo: il padding lo allarga e il
   margine negativo se lo riprende. */
.piatto__altro {
    display: block; margin: -8px 0 -10px; padding: 10px 0 12px;
    font-size: 13px; font-weight: 600; color: var(--ds-text-primary);
    text-decoration: underline; text-decoration-color: var(--menu-hairline);
    text-underline-offset: 3px; text-decoration-thickness: 1.5px;
}

/* Allergeni in pillole: si contano a colpo d'occhio, e chi ne cerca uno lo
   trova senza leggere una frase. In --ds-text-secondary, non subtle: sono
   informazioni che l'ospite cerca. */
.piatto__allergeni {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px;
    margin-top: 10px; font-size: 12px; line-height: 1;
}
.piatto__etichetta { color: var(--ds-text-muted); font-weight: 500; margin-right: 2px; }
.chip {
    display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
    border-radius: 999px; background: var(--menu-chip);
    color: var(--ds-text-secondary); font-weight: 500;
}
.piatto__abbinati {
    display: flex; gap: 6px; align-items: flex-start;
    margin-top: 8px; font-size: 13px; line-height: 1.45; color: var(--ds-text-muted);
}
.piatto__abbinati svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }
.piatto__abbinati a {
    color: var(--ds-text-primary); font-weight: 500; text-decoration: underline;
    text-decoration-color: var(--ds-text-subtle); text-underline-offset: 3px;
}

.piatto__foto {
    position: relative; flex: none; align-self: flex-start;
    width: 96px; height: 96px; border-radius: 16px; overflow: hidden;
    background: var(--menu-placeholder); cursor: zoom-in;
}
.piatto__foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Un filo scuro sul bordo: le foto chiare (un dolce, un piatto bianco) si
   stacchevano dal canvas crema. */
.piatto__foto::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(17, 17, 19, 0.06); pointer-events: none;
}
/* Le bottiglie sono foto verticali su fondo bianco: ritagliate a quadrato
   restava un pezzo d'etichetta. Intere, su una piastrella bianca. */
.piatto__foto.is-bottiglia { background: var(--ds-surface); }
.piatto__foto.is-bottiglia img { object-fit: contain; padding: 8px 0; }
.piatto__foto:focus-visible { border-radius: 16px; }

/* Il vino raggiunto da «Si abbina con» lampeggia una volta, per dire
   all'occhio dove guardare dopo il salto. */
.piatto.is-evidenziato::before {
    content: ''; position: absolute; inset: 4px -12px; z-index: -1;
    border-radius: 16px; background: var(--menu-flash);
    animation: lampo 1.8s ease both;
}
@keyframes lampo { 0%, 45% { opacity: 1; } 100% { opacity: 0; } }

@media (min-width: 640px) {
    .sezione { padding-top: 44px; }
    .sezione h2 { font-size: 30px; }
    .piatto { padding: 22px 0; gap: 22px; }
    .piatto__foto { width: 112px; height: 112px; }
}

/* Primo caricamento: le sezioni salgono in sequenza. Solo la prima volta —
   al cambio lingua il contenuto resta fermo sotto gli occhi. */
.anima .sezione { animation: sale 0.5s var(--menu-ease) both; }
.anima .sezione:nth-child(2) { animation-delay: 0.06s; }
.anima .sezione:nth-child(3) { animation-delay: 0.12s; }
.anima .sezione:nth-child(n+4) { animation-delay: 0.18s; }
@keyframes sale { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* --- Attesa e stati ------------------------------------------------------ */
.scheletro__titolo { width: 140px; height: 26px; border-radius: 8px; margin: 36px 0 12px; }
.scheletro__riga { display: flex; gap: 16px; padding: 18px 0; }
.scheletro__riga + .scheletro__riga { border-top: 1px solid var(--menu-hairline); }
.scheletro__testo { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.scheletro__testo span { height: 12px; border-radius: 6px; }
.scheletro__testo span:first-child { width: 55%; height: 15px; }
.scheletro__testo span:nth-child(2) { width: 85%; }
.scheletro__testo span:nth-child(3) { width: 40%; }
.scheletro__foto { width: 96px; height: 96px; border-radius: 16px; flex: none; }
.scheletro__titolo, .scheletro__testo span, .scheletro__foto {
    background: linear-gradient(90deg, var(--menu-placeholder) 0%, #f4f1ea 50%, var(--menu-placeholder) 100%);
    background-size: 200% 100%;
    animation: luccica 1.4s ease-in-out infinite;
}
@keyframes luccica { from { background-position: 100% 0; } to { background-position: -100% 0; } }

.stato {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center; color: var(--ds-text-muted); padding: 64px 24px;
}
.stato svg { width: 40px; height: 40px; color: var(--ds-text-subtle); }
.stato p { max-width: 320px; }

footer {
    max-width: 720px; margin: 0 auto;
    text-align: center; color: var(--ds-text-subtle);
    font-size: 13px; font-weight: 500;
    padding: 0 16px 40px; padding-bottom: max(40px, calc(env(safe-area-inset-bottom) + 24px));
}
footer:not(:empty)::before {
    content: ''; display: block; width: 32px; height: 1px; margin: 0 auto 20px;
    background: var(--ds-text-subtle); opacity: 0.5;
}

/* --- Visore foto ---------------------------------------------------------
   Fondo scuro pieno come sul palmare: la foto ha il palco, sotto solo nome
   e prezzo. Un tocco ovunque chiude; la X c'è per chi non lo sa. */
.fotovelo {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    padding: 24px 20px; padding-bottom: max(24px, env(safe-area-inset-bottom));
    background: var(--menu-scrim);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    cursor: zoom-out;
    animation: velo 0.22s ease-out both;
}
.fotovelo img {
    max-height: 70vh; max-width: min(100%, 720px); border-radius: 20px; object-fit: contain;
    box-shadow: 0 30px 80px -24px rgba(0, 0, 0, 0.7);
    animation: foto 0.36s var(--menu-ease) both;
}
.fotovelo__nome { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff; text-align: center; line-height: 1.3; }
.fotovelo__prezzo { font-size: 16px; color: rgba(255, 255, 255, 0.7); margin-top: 4px; text-align: center; }
.fotovelo__chiudi {
    position: absolute; right: 16px; top: max(16px, env(safe-area-inset-top));
    width: 44px; height: 44px; border-radius: 999px;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.14); color: #ffffff;
}
.fotovelo__chiudi svg { width: 18px; height: 18px; }
@keyframes velo { from { opacity: 0; } to { opacity: 1; } }
@keyframes foto { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: none; } }

/* --- QR del tavolo: «Paga il conto» --------------------------------------
   Barra fissa in basso, solo mentre il conto del tavolo è aperto: compare
   da sola quando il cameriere chiude la comanda, sparisce al saldo. */
.paga {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 16px 16px 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--ds-public-canvas) 65%, transparent);
}
.paga a {
    display: flex; align-items: center; justify-content: center;
    max-width: 720px; margin: 0 auto; min-height: 52px; padding: 0 20px; border-radius: 999px;
    background: var(--ds-action-bg); color: var(--ds-action-fg);
    font-size: 16px; font-weight: 600; text-decoration: none;
    box-shadow: 0 12px 28px -12px rgba(17, 17, 19, 0.45);
}
body.con-paga footer { padding-bottom: max(112px, calc(env(safe-area-inset-bottom) + 96px)); }
.paga a[aria-busy="true"] { opacity: 0.7; pointer-events: none; }
/* Tavolo con la comanda in cassa: il conto si legge al tocco, e se la cassa
   non risponde l'ospite deve sapere a chi chiedere. */
.paga__nota {
    max-width: 720px; margin: 0 auto 10px; padding: 10px 14px; border-radius: 14px;
    background: var(--ds-public-canvas); color: inherit; font-size: 14px; text-align: center;
    box-shadow: 0 8px 20px -14px rgba(17, 17, 19, 0.45);
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="hero" id="hero">
    <div class="hero__bar">
        <div class="hero__brand">
            <img class="hero__logo" id="logo" alt="" hidden />
            <h1 class="hero__name" id="nome-ristorante">&nbsp;</h1>
            <p class="hero__tagline" id="tagline" hidden></p>
            <p class="hero__tavolo" id="tavolo" hidden></p>
        </div>
        <label class="lingua">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            <span id="lingua-nome"></span>
            <svg class="lingua__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            <select id="lingua"></select>
        </label>
    </div>
</header>

<nav class="catnav" id="catnav" hidden><div class="catnav__inner" id="catnav-inner"></div></nav>

<main id="main" aria-busy="true">
    <div aria-hidden="true">
        <div class="scheletro__titolo"></div>
        <div class="scheletro__riga"><div class="scheletro__testo"><span></span><span></span><span></span></div><div class="scheletro__foto"></div></div>
        <div class="scheletro__riga"><div class="scheletro__testo"><span></span><span></span><span></span></div></div>
        <div class="scheletro__riga"><div class="scheletro__testo"><span></span><span></span><span></span></div><div class="scheletro__foto"></div></div>
    </div>
</main>

<footer id="footer"></footer>

<div class="paga" id="paga" hidden><p class="paga__nota" id="paga-nota" role="status" hidden></p><a id="paga-link" class="tnum" href="#"></a></div>

<script>
'use strict';
(function () {
    /* Testi della pagina nelle quattro lingue del menu. I piatti usano le
       traduzioni del CRM quando ci sono, altrimenti restano in italiano. */
    var UI = {
        it: { tavolo: 'Tavolo', paga: 'Paga il conto', attesa: 'Un attimo…', cassaKo: 'Non riusciamo a leggere il conto adesso: chiedi al personale.', pagato: 'Il conto risulta già pagato.', lingua: 'Lingua', categorie: 'Categorie', foto: 'Foto', chiudi: 'Chiudi', allergeni: 'Allergeni', abbinati: 'Si abbina con', altro: 'Leggi tutto', meno: 'Riduci', vuoto: 'Il menu non è al momento disponibile.', errore: 'Non riusciamo a caricare il menu. Riprova tra poco.' },
        en: { tavolo: 'Table', paga: 'Pay the bill', attesa: 'One moment…', cassaKo: 'We can’t load the bill right now: please ask the staff.', pagato: 'This bill has already been paid.', lingua: 'Language', categorie: 'Categories', foto: 'Photo', chiudi: 'Close', allergeni: 'Allergens', abbinati: 'Pairs with', altro: 'Read more', meno: 'Show less', vuoto: 'The menu is not available right now.', errore: 'We could not load the menu. Please try again shortly.' },
        fr: { tavolo: 'Table', paga: 'Payer l’addition', attesa: 'Un instant…', cassaKo: 'Impossible de charger l’addition pour le moment : demandez au personnel.', pagato: 'Cette addition est déjà réglée.', lingua: 'Langue', categorie: 'Catégories', foto: 'Photo', chiudi: 'Fermer', allergeni: 'Allergènes', abbinati: 'S’accorde avec', altro: 'Lire la suite', meno: 'Réduire', vuoto: 'Le menu n’est pas disponible pour le moment.', errore: 'Impossible de charger le menu. Réessayez dans un instant.' },
        de: { tavolo: 'Tisch', paga: 'Rechnung bezahlen', attesa: 'Einen Moment…', cassaKo: 'Die Rechnung kann gerade nicht geladen werden: Bitte frag das Personal.', pagato: 'Diese Rechnung ist bereits bezahlt.', lingua: 'Sprache', categorie: 'Kategorien', foto: 'Foto', chiudi: 'Schließen', allergeni: 'Allergene', abbinati: 'Passt zu', altro: 'Weiterlesen', meno: 'Weniger', vuoto: 'Die Speisekarte ist derzeit nicht verfügbar.', errore: 'Die Speisekarte konnte nicht geladen werden. Bitte versuche es gleich noch einmal.' }
    };
    // Ogni lingua col suo nome: chi cerca la propria la riconosce così.
    var NOME_LINGUA = { it: 'Italiano', en: 'English', fr: 'Français', de: 'Deutsch' };

    /* Gli allergeni nel CRM sono i 14 nomi UE in italiano (COMMON_ALLERGENS in
       types.ts): la traduzione è un dizionario fisso, nei nomi ufficiali
       dell'allegato II del Reg. UE 1169/2011. Un valore fuori elenco resta
       com'è — meglio in italiano che sparito. */
    var ALLERGENI = {
        'glutine':         { en: 'Gluten',      fr: 'Gluten',          de: 'Gluten' },
        'crostacei':       { en: 'Crustaceans', fr: 'Crustacés',       de: 'Krebstiere' },
        'uova':            { en: 'Eggs',        fr: 'Œufs',            de: 'Eier' },
        'pesce':           { en: 'Fish',        fr: 'Poisson',         de: 'Fisch' },
        'arachidi':        { en: 'Peanuts',     fr: 'Arachides',       de: 'Erdnüsse' },
        'soia':            { en: 'Soy',         fr: 'Soja',            de: 'Soja' },
        'latte':           { en: 'Milk',        fr: 'Lait',            de: 'Milch' },
        'frutta a guscio': { en: 'Tree nuts',   fr: 'Fruits à coque',  de: 'Schalenfrüchte' },
        'sedano':          { en: 'Celery',      fr: 'Céleri',          de: 'Sellerie' },
        'senape':          { en: 'Mustard',     fr: 'Moutarde',        de: 'Senf' },
        'sesamo':          { en: 'Sesame',      fr: 'Sésame',          de: 'Sesam' },
        'solfiti':         { en: 'Sulphites',   fr: 'Sulfites',        de: 'Sulfite' },
        'lupini':          { en: 'Lupin',       fr: 'Lupin',           de: 'Lupinen' },
        'molluschi':       { en: 'Molluscs',    fr: 'Mollusques',      de: 'Weichtiere' }
    };

    /* L'ordine delle portate non è alfabetico: si mangia in quest'ordine. Le
       categorie fuori elenco vanno in coda, in ordine di nome. */
    var ORDINE = ['antipast', 'primi', 'second', 'griglia', 'contorn', 'senza glutine', 'frutta', 'gelat', 'dessert', 'dolc', 'menu', 'bibite', 'vini bianchi', 'vini ross', 'vino', 'caff', 'liquor'];
    function pesoCategoria(nome) {
        var n = String(nome).toLowerCase();
        for (var i = 0; i < ORDINE.length; i++) if (n.indexOf(ORDINE[i]) !== -1) return i;
        return ORDINE.length;
    }

    var ICONA = {
        calice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-.5 6a3.5 3.5 0 0 1-7 0L8 3ZM12 12.5V20M8.5 20h7"/></svg>',
        piatto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3.5"/><path d="M3 4v4a2 2 0 0 0 2 2V20M5 4v4M21 4c-1.5 1-2 3-2 5h2v11"/></svg>',
        chiudi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
    };

    /* Tre ingressi: /menu, /m/<slug> e /t/<token> — il QR unico del tavolo,
       che porta anche il nome del tavolo e, a conto aperto, «Paga il conto». */
    var tavoloMatch = location.pathname.match(/^\/t\/([A-Za-z0-9_-]+)/);
    var tavoloToken = tavoloMatch ? tavoloMatch[1] : null;
    var slugMatch = location.pathname.match(/^\/m\/([^/]+)/);
    var apiPath = tavoloToken ? '/public/table/' + tavoloToken
        : (slugMatch ? '/public/' + slugMatch[1] + '/menu' : '/public/menu');
    var tavolo = null;  // nome del tavolo, solo in modalità tavolo
    var conto = null;   // { open, url, residual_cents, currency, cassa }
    var inCassa = false; // tocco in corso: il conto si sta leggendo dalla cassa

    var lang = null;
    try { lang = localStorage.getItem('menu_lang'); } catch (e) { /* storage bloccato: si va col browser */ }
    if (!lang || !UI[lang]) {
        var nav = (navigator.language || 'it').slice(0, 2).toLowerCase();
        lang = UI[nav] ? nav : 'it';
    }
    var riduciMoto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var dati = null;
    var primoRender = true;
    var main = document.getElementById('main');
    var catnav = document.getElementById('catnav');
    var navBox = document.getElementById('catnav-inner');

    function t(chiave) { return UI[lang][chiave]; }
    function euro(n) {
        // La valuta arriva col menu: fino a quel momento (e se manca) l'euro,
        // che è dove l'applicazione ha sempre vissuto. I centesimi solo
        // quando ci sono: «9 €» si legge prima di «9,00 €».
        var valuta = (dati && dati.currency) || 'EUR';
        var tondo = Math.round(n * 100) % 100 === 0;
        return new Intl.NumberFormat(lang === 'it' ? 'it-IT' : lang, {
            style: 'currency', currency: valuta,
            minimumFractionDigits: tondo ? 0 : 2, maximumFractionDigits: 2
        }).format(n);
    }
    /* Mai maiuscolo (§5.2), nemmeno quando la traduzione arriva così dal CRM
       («SOFT DRINKS»): una scritta tutta maiuscola torna con la sola
       iniziale. Sigle corte come «DOC» restano. */
    function senzaMaiuscolo(s) {
        s = String(s);
        if (s.length > 4 && s === s.toUpperCase() && s !== s.toLowerCase()) {
            return s.charAt(0) + s.slice(1).toLowerCase();
        }
        return s;
    }
    /* Le schede dei vini sono scritte «cantina · DOC · vitigno · grado — nota»:
       la parte prima del trattino lungo va sotto il nome, la nota sotto.
       Un piatto senza trattino resta una descrizione sola. */
    function testoPiatto(p) {
        var tr = p.translations && p.translations[lang];
        var desc = (lang !== 'it' && tr && tr.description) ? tr.description : (p.description || '');
        var scheda = '';
        var taglio = desc.indexOf(' — ');
        if (taglio > 0 && taglio < 160) {
            scheda = desc.slice(0, taglio).trim();
            desc = desc.slice(taglio + 3).trim();
        }
        return {
            nome: (lang !== 'it' && tr && tr.name) ? tr.name : p.name,
            scheda: scheda,
            desc: desc,
            // Gli ingredienti restano sempre aperti, servono a scegliere; si
            // chiude solo la nota di degustazione, o un testo lungo.
            chiudi: !!scheda || desc.length > 220
        };
    }
    function nomeAllergene(a) {
        var tr = ALLERGENI[String(a).trim().toLowerCase()];
        return (lang !== 'it' && tr && tr[lang]) || a;
    }
    function nomeCategoria(cat) {
        var tr = dati.categorie && dati.categorie[cat];
        return senzaMaiuscolo((lang !== 'it' && tr && tr[lang]) ? tr[lang] : cat);
    }
    function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }
    function chiave(nome) { return String(nome).trim().toLowerCase(); }

    function mostraStato(testo) {
        main.removeAttribute('aria-busy');
        main.innerHTML = '<div class="stato" role="status">' + ICONA.piatto + '<p>' + esc(testo) + '</p></div>';
    }

    function soldi(cents, valuta) {
        return new Intl.NumberFormat(lang === 'it' ? 'it-IT' : lang, { style: 'currency', currency: valuta || 'EUR' }).format(cents / 100);
    }

    function renderPaga() {
        var tav = document.getElementById('tavolo');
        tav.hidden = !tavolo;
        if (tavolo) tav.textContent = t('tavolo') + ' ' + tavolo;
        var box = document.getElementById('paga');
        // `cassa`: la comanda è nella cassa Passepartout e il conto si
        // prende al tocco (vedi vaiAPagare); prima l'url può non esserci.
        var aperto = !!(conto && conto.open && (conto.url || conto.cassa));
        box.hidden = !aperto;
        document.body.classList.toggle('con-paga', aperto);
        if (!aperto) return;
        var link = document.getElementById('paga-link');
        link.href = conto.url ? conLingua(conto.url) : '#';
        link.textContent = inCassa ? t('attesa')
            : t('paga') + (conto.residual_cents > 0 ? ' · ' + soldi(conto.residual_cents, conto.currency) : '');
        if (inCassa) link.setAttribute('aria-busy', 'true'); else link.removeAttribute('aria-busy');
    }

    // La pagina di pagamento parla italiano e inglese: le altre lingue del
    // menu ci arrivano in inglese, non nel suo fallback italiano.
    function conLingua(url) {
        return url + (url.indexOf('?') === -1 ? '?' : '&') + 'lng=' + (lang === 'it' ? 'it' : 'en');
    }

    function notaPaga(testo) {
        var nota = document.getElementById('paga-nota');
        nota.textContent = testo || '';
        nota.hidden = !testo;
    }

    /* Tavolo con la comanda in cassa: il conto si legge adesso dalla cassa
       (o si riallinea, se nessuno ha ancora pagato) e poi si va a pagare. */
    function vaiAPagare(ev) {
        if (!conto || !conto.cassa) return; // conto del CRM: basta il link
        ev.preventDefault();
        if (inCassa) return;
        inCassa = true;
        notaPaga('');
        renderPaga();
        fetch('/public/table/' + tavoloToken + '/conto/cassa', { method: 'POST', headers: { Accept: 'application/json' } })
            .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (esito) {
                if (esito.ok && esito.j.url) { location.assign(conLingua(esito.j.url)); return; }
                inCassa = false;
                notaPaga(esito.j && esito.j.error === 'chiuso' ? t('pagato') : t('cassaKo'));
                aggiornaConto();
                renderPaga();
            })
            .catch(function () {
                inCassa = false;
                notaPaga(t('cassaKo'));
                renderPaga();
            });
    }

    /* Ricontrollo del conto ogni 30 s, solo a pagina visibile, e al ritorno
       sulla pagina: il menu non si riscarica, si chiede solo lo stato. */
    function aggiornaConto() {
        if (!tavoloToken || document.visibilityState !== 'visible') return;
        fetch('/public/table/' + tavoloToken + '/conto', { headers: { Accept: 'application/json' } })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) { if (j) { conto = j.pay || null; renderPaga(); } })
            .catch(function () {});
    }

    function renderLangs() {
        var sel = document.getElementById('lingua');
        if (!sel.options.length) {
            Object.keys(UI).forEach(function (l) {
                var o = document.createElement('option');
                o.value = l;
                o.textContent = NOME_LINGUA[l];
                sel.appendChild(o);
            });
            sel.addEventListener('change', function () {
                lang = sel.value;
                try { localStorage.setItem('menu_lang', lang); } catch (e) { /* solo per la prossima visita */ }
                document.documentElement.lang = lang;
                renderLangs();
                render();
            });
        }
        sel.value = lang;
        sel.setAttribute('aria-label', t('lingua'));
        document.getElementById('lingua-nome').textContent = NOME_LINGUA[lang];
    }

    function render() {
        catnav.setAttribute('aria-label', t('categorie'));
        renderPaga();
        if (!dati) return;
        var perCat = {};
        dati.piatti.forEach(function (p) { (perCat[p.category] = perCat[p.category] || []).push(p); });
        /* Prima le categorie ordinate a mano nel CRM (categorie_ordine),
           poi le altre con l'euristica delle portate. */
        var ordineCRM = dati.categorie_ordine || [];
        var cats = Object.keys(perCat).sort(function (a, b) {
            var ia = ordineCRM.indexOf(a), ib = ordineCRM.indexOf(b);
            if (ia !== -1 && ib !== -1) return ia - ib;
            if (ia !== -1) return -1;
            if (ib !== -1) return 1;
            var d = pesoCategoria(a) - pesoCategoria(b);
            return d !== 0 ? d : a.localeCompare(b);
        });

        navBox.innerHTML = '<span class="catnav__pill is-fermo" id="catnav-pill" aria-hidden="true"></span>';
        cats.forEach(function (cat, i) {
            var a = document.createElement('a');
            a.href = '#cat-' + i;
            a.textContent = nomeCategoria(cat);
            a.setAttribute('data-i', String(i));
            navBox.appendChild(a);
        });
        catnav.hidden = cats.length < 2;

        /* Ogni piatto ha un id: «Si abbina con» porta al vino in carta.
           Si confronta il nome italiano, quello che il CRM salva negli
           abbinamenti; un vino che non è in questo menu resta testo. */
        var n = 0;
        var idDi = {};
        cats.forEach(function (cat) {
            perCat[cat].forEach(function (p) { p._id = 'p-' + (n++); if (!idDi[chiave(p.name)]) idDi[chiave(p.name)] = p._id; });
        });

        var html = '';
        cats.forEach(function (cat, i) {
            var lista = perCat[cat];
            html += '<section class="sezione" aria-labelledby="cat-' + i + '"><div class="sezione__testa"><h2 id="cat-' + i + '">' + esc(nomeCategoria(cat)) + '</h2>'
                + '<span class="sezione__conta tnum" aria-hidden="true">' + lista.length + '</span></div>';
            lista.forEach(function (p) {
                var tp = testoPiatto(p);
                var prezzo = p.price > 0 ? euro(p.price) : '';
                var abbinati = (p.abbinati || []).map(function (v) {
                    var id = idDi[chiave(v)];
                    return id ? '<a href="#' + id + '" data-vai="' + id + '">' + esc(v) + '</a>' : esc(v);
                });
                var soloRiga = !tp.desc && !tp.scheda && !p.photo_url && !abbinati.length && !(p.allergens && p.allergens.length);
                html += '<article class="piatto' + (soloRiga ? ' is-riga' : '') + '" id="' + p._id + '" tabindex="-1">'
                    + '<div class="piatto__testo">'
                    + '<div class="piatto__riga"><h3 class="piatto__nome">' + esc(tp.nome) + '</h3>'
                    + (prezzo ? '<span class="piatto__prezzo tnum">' + esc(prezzo) + '</span>' : '') + '</div>'
                    + (tp.scheda ? '<p class="piatto__scheda">' + esc(tp.scheda) + '</p>' : '')
                    + (tp.desc ? '<p class="piatto__desc' + (tp.chiudi ? ' is-chiusa' : '') + '" id="' + p._id + '-d">' + esc(tp.desc) + '</p>' : '')
                    + (tp.desc && tp.chiudi ? '<button type="button" class="piatto__altro" aria-controls="' + p._id + '-d" aria-expanded="false" hidden>' + esc(t('altro')) + '</button>' : '')
                    + (p.allergens && p.allergens.length ? '<div class="piatto__allergeni"><span class="piatto__etichetta">' + esc(t('allergeni')) + '</span>'
                        + p.allergens.map(function (a) { return '<span class="chip">' + esc(nomeAllergene(a)) + '</span>'; }).join('') + '</div>' : '')
                    + (abbinati.length ? '<div class="piatto__abbinati">' + ICONA.calice + '<span>' + esc(t('abbinati')) + ' ' + abbinati.join(', ') + '</span></div>' : '')
                    + '</div>'
                    + (p.photo_url ? '<button type="button" class="piatto__foto" aria-label="' + esc(t('foto') + ': ' + tp.nome) + '" data-nome="' + esc(tp.nome) + '" data-prezzo="' + esc(prezzo) + '"><img src="' + esc(p.photo_url) + '" alt="" loading="lazy" decoding="async" width="112" height="112" /></button>' : '')
                    + '</article>';
            });
            html += '</section>';
        });
        if (!html) { mostraStato(t('vuoto')); return; }
        main.removeAttribute('aria-busy');
        main.classList.toggle('anima', primoRender && !riduciMoto);
        primoRender = false;
        main.innerHTML = html;
        misuraNote();
        attiva = -1;
        spia();
    }

    /* «Leggi tutto» compare solo se la nota è davvero tagliata: una nota di
       due righe non deve promettere altro testo. Si rimisura quando cambia
       la larghezza (rotazione del telefono). */
    function misuraNote() {
        var bottoni = main.querySelectorAll('.piatto__altro');
        for (var i = 0; i < bottoni.length; i++) {
            var b = bottoni[i];
            if (b.getAttribute('aria-expanded') === 'true') continue;
            var nota = document.getElementById(b.getAttribute('aria-controls'));
            b.hidden = !nota || nota.scrollHeight <= nota.clientHeight + 1;
        }
    }
    main.addEventListener('click', function (ev) {
        var b = ev.target.closest ? ev.target.closest('.piatto__altro') : null;
        if (!b) return;
        var nota = document.getElementById(b.getAttribute('aria-controls'));
        var apri = b.getAttribute('aria-expanded') !== 'true';
        nota.classList.toggle('is-chiusa', !apri);
        b.setAttribute('aria-expanded', String(apri));
        b.textContent = apri ? t('meno') : t('altro');
    });

    /* --- La barra segue la lettura ---------------------------------------
       La categoria «attiva» è l'ultima il cui titolo è passato sotto la
       barra. Dopo un tocco su una pillola la scelta resta quella finché
       l'ospite non scorre di suo: lo scorrimento animato attraversa le
       categorie in mezzo e le farebbe lampeggiare tutte, e in fondo alla
       pagina il titolo scelto può non arrivare mai alla barra. */
    var attiva = -1;
    var scelta = -1;
    var inAttesa = false;

    // La pillola piena segue la categoria attiva. Al primo posizionamento
    // (e dopo un cambio lingua o di larghezza) ci va senza scivolare.
    function posaPillola(anima) {
        var pill = document.getElementById('catnav-pill');
        var p = navBox.querySelector('a[aria-current="true"]');
        if (!pill || !p) return;
        pill.classList.toggle('is-fermo', !anima);
        pill.style.width = p.offsetWidth + 'px';
        pill.style.transform = 'translateX(' + p.offsetLeft + 'px)';
    }

    function segna(idx) {
        if (idx === attiva) return;
        var prima = attiva;
        attiva = idx;
        var pillole = navBox.querySelectorAll('a[data-i]');
        for (var i = 0; i < pillole.length; i++) pillole[i].setAttribute('aria-current', String(i === idx));
        var p = pillole[idx];
        if (!p || catnav.hidden) return;
        posaPillola(prima !== -1 && !riduciMoto);
        // Scorre solo la barra (scrollLeft), mai la pagina: scrollIntoView
        // su iOS sposta anche la finestra.
        var sinistra = p.offsetLeft - (navBox.clientWidth - p.offsetWidth) / 2;
        navBox.scrollTo({ left: Math.max(0, sinistra), behavior: riduciMoto ? 'auto' : 'smooth' });
    }

    function spia() {
        inAttesa = false;
        if (catnav.hidden) return;
        catnav.classList.toggle('is-stuck', catnav.getBoundingClientRect().top <= 0.5);
        if (scelta !== -1) { segna(scelta); return; }
        var titoli = main.querySelectorAll('.sezione h2');
        if (!titoli.length) return;
        var soglia = catnav.offsetHeight + 24;
        var idx = 0;
        for (var i = 0; i < titoli.length; i++) {
            if (titoli[i].getBoundingClientRect().top <= soglia) idx = i; else break;
        }
        // In fondo alla pagina l'ultima categoria, anche se corta non porta
        // il suo titolo fino alla barra.
        var doc = document.documentElement;
        if (window.scrollY > 0 && window.innerHeight + window.scrollY >= doc.scrollHeight - 2) idx = titoli.length - 1;
        segna(idx);
    }

    window.addEventListener('scroll', function () {
        if (!inAttesa) { inAttesa = true; requestAnimationFrame(spia); }
    }, { passive: true });
    var larghezza = window.innerWidth;
    window.addEventListener('resize', function () {
        spia();
        posaPillola(false);
        // Solo la larghezza cambia dove vanno a capo le note: su iOS la
        // barra dell'indirizzo che entra ed esce manda resize di sola altezza.
        if (window.innerWidth !== larghezza) { larghezza = window.innerWidth; misuraNote(); }
    }, { passive: true });
    // Le pillole si misurano col font di sistema finché Hanken Grotesk non
    // arriva: a font caricato larghezze e note vanno rimisurate. Anche
    // loadingdone, perché ready può risolversi prima che il font sia chiesto.
    if (document.fonts && document.fonts.ready) {
        var rimisura = function () { posaPillola(false); misuraNote(); };
        document.fonts.ready.then(rimisura);
        if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', rimisura);
    }
    // Un gesto dell'ospite (dito, rotella, tastiera) rimette la barra a
    // seguire lo scorrimento; quello animato da un tocco non ne genera.
    ['touchstart', 'wheel', 'keydown'].forEach(function (ev) {
        window.addEventListener(ev, function () { scelta = -1; }, { passive: true });
    });

    function vaiA(el, idx) {
        scelta = idx;
        segna(idx);
        var y = el.getBoundingClientRect().top + window.scrollY - catnav.offsetHeight - 12;
        window.scrollTo({ top: Math.max(0, y), behavior: riduciMoto ? 'auto' : 'smooth' });
    }

    navBox.addEventListener('click', function (ev) {
        var a = ev.target.closest ? ev.target.closest('a[data-i]') : null;
        if (!a) return;
        ev.preventDefault();
        var i = Number(a.getAttribute('data-i'));
        var titolo = document.getElementById('cat-' + i);
        if (titolo) vaiA(titolo, i);
    });

    // «Si abbina con Virgani» porta al Virgani in carta, lo fa lampeggiare
    // una volta e ci sposta il focus, per chi naviga con lo screen reader.
    main.addEventListener('click', function (ev) {
        var a = ev.target.closest ? ev.target.closest('a[data-vai]') : null;
        if (!a) return;
        var vino = document.getElementById(a.getAttribute('data-vai'));
        if (!vino) return;
        ev.preventDefault();
        var sezioni = main.querySelectorAll('.sezione');
        var idx = Array.prototype.indexOf.call(sezioni, vino.closest('.sezione'));
        vaiA(vino, idx);
        vino.classList.remove('is-evidenziato');
        void vino.offsetWidth; // riparte l'animazione se si ritocca lo stesso vino
        vino.classList.add('is-evidenziato');
        vino.focus({ preventScroll: true });
    });
    main.addEventListener('animationend', function (ev) {
        if (ev.animationName === 'lampo') ev.target.classList.remove('is-evidenziato');
    });

    /* Il visore foto: si apre dal tocco sulla miniatura, si chiude con un
       tocco ovunque o con Esc. Delegato su document perché le righe si
       rirenderizzano a ogni cambio lingua. */
    var apertoDa = null;
    function chiudiFoto() {
        var v = document.getElementById('fotovelo');
        if (!v) return;
        v.remove();
        document.documentElement.style.overflow = '';
        if (apertoDa && document.contains(apertoDa)) apertoDa.focus({ preventScroll: true });
        apertoDa = null;
    }
    document.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.piatto__foto') : null;
        if (!btn) return;
        var img = btn.querySelector('img');
        if (!img) return;
        chiudiFoto();
        apertoDa = btn;
        var velo = document.createElement('div');
        velo.className = 'fotovelo';
        velo.id = 'fotovelo';
        velo.setAttribute('role', 'dialog');
        velo.setAttribute('aria-modal', 'true');
        velo.setAttribute('aria-label', btn.getAttribute('data-nome') || '');
        var chiudi = document.createElement('button');
        chiudi.type = 'button';
        chiudi.className = 'fotovelo__chiudi';
        chiudi.setAttribute('aria-label', t('chiudi'));
        chiudi.innerHTML = ICONA.chiudi;
        velo.appendChild(chiudi);
        var grande = document.createElement('img');
        grande.src = img.currentSrc || img.src;
        grande.alt = btn.getAttribute('data-nome') || '';
        velo.appendChild(grande);
        var testo = document.createElement('div');
        var nome = document.createElement('div');
        nome.className = 'fotovelo__nome';
        nome.textContent = btn.getAttribute('data-nome') || '';
        testo.appendChild(nome);
        if (btn.getAttribute('data-prezzo')) {
            var prezzo = document.createElement('div');
            prezzo.className = 'fotovelo__prezzo tnum';
            prezzo.textContent = btn.getAttribute('data-prezzo');
            testo.appendChild(prezzo);
        }
        velo.appendChild(testo);
        velo.addEventListener('click', chiudiFoto);
        document.body.appendChild(velo);
        // Sotto il visore la pagina non scorre: sul telefono il dito che
        // chiude trascinerebbe il menu.
        document.documentElement.style.overflow = 'hidden';
        chiudi.focus({ preventScroll: true });
    });
    document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') chiudiFoto();
    });
    // Una foto verticale è una bottiglia: va intera, non ritagliata.
    document.addEventListener('load', function (ev) {
        var el = ev.target;
        var btn = el && el.closest ? el.closest('.piatto__foto') : null;
        if (btn && el.naturalHeight > el.naturalWidth * 1.15) btn.classList.add('is-bottiglia');
    }, true);
    // Una foto che non scarica (link rotto, file rimosso) toglie la sua
    // miniatura: meglio nessuna foto che un riquadro vuoto da toccare.
    document.addEventListener('error', function (ev) {
        var el = ev.target;
        var btn = el && el.closest ? el.closest('.piatto__foto') : null;
        if (btn) btn.remove();
    }, true);

    document.documentElement.lang = lang;
    renderLangs();
    render();

    fetch(apiPath, { headers: { Accept: 'application/json' } })
        .then(function (r) {
            if (!r.ok) throw new Error(String(r.status));
            return r.json();
        })
        .then(function (json) {
            if (tavoloToken) {
                // Modalità tavolo: menu (null se spento) e conto in un colpo.
                tavolo = json.table && json.table.name ? json.table.name : null;
                conto = json.pay || null;
                dati = json.menu || null;
                document.getElementById('paga-link').addEventListener('click', vaiAPagare);
                // Tornando indietro dal pagamento la pagina può riaprirsi
                // dalla cache del browser col tasto ancora in attesa.
                window.addEventListener('pageshow', function (e) {
                    if (e.persisted && inCassa) { inCassa = false; renderPaga(); aggiornaConto(); }
                });
                setInterval(aggiornaConto, 30000);
                document.addEventListener('visibilitychange', aggiornaConto);
            } else {
                dati = json;
            }
            var nome = json.restaurant || '';
            // branding manca dal backend di prima del restyling (frontend e
            // backend non escono insieme): senza, la testata resta col nome.
            var branding = json.branding && typeof json.branding === 'object' ? json.branding : {};
            document.getElementById('nome-ristorante').textContent = nome || ' ';
            document.title = (nome ? nome + ' · ' : '') + 'Menu';
            document.getElementById('footer').textContent = nome;
            if (typeof branding.tagline === 'string' && branding.tagline) {
                var tagline = document.getElementById('tagline');
                tagline.textContent = branding.tagline;
                tagline.hidden = false;
            }
            if (typeof branding.logo_url === 'string' && branding.logo_url) {
                // Il nome esce subito, prima che il logo scarichi: sarebbe un
                // lampo di testo sostituito da un'immagine. Se il logo non
                // arriva, il nome torna al suo posto.
                var hero = document.getElementById('hero');
                var logo = document.getElementById('logo');
                hero.classList.add('con-logo');
                logo.addEventListener('load', function () { logo.classList.add('is-pronto'); });
                logo.addEventListener('error', function () { logo.hidden = true; hero.classList.remove('con-logo'); });
                logo.src = branding.logo_url;
                logo.hidden = false;
            }
            render();
            // Menu spento: dal QR del tavolo resta comunque «Paga il conto».
            if (!dati) mostraStato(t('vuoto'));
        })
        .catch(function (err) {
            // 503: menu spento; 404: adesivo di un tavolo che non c'è più.
            mostraStato(err && (err.message === '503' || err.message === '404') ? t('vuoto') : t('errore'));
        });
})();
</script>
</body>
</html>
