# CI del repo: typecheck + build di entrambi i lati, poi i test API contro
# un Postgres di servizio. Gira su ogni PR e su main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # I branch pushati dal workflow claude-dev-task (GITHUB_TOKEN) non innescano
  # pull_request per la regola anti-ricorsione di GitHub: quel workflow
  # dispatcha la CI esplicitamente sul branch della card — i check si
  # agganciano allo stesso SHA e la PR li vede.
  workflow_dispatch:

jobs:
  typecheck-build:
    name: Typecheck e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck frontend
        run: npx tsc --noEmit
      # Il typecheck non vede le chiavi di traduzione: questo controlla che i
      # dizionari di public/locales restino allineati fra le lingue.
      - name: Dizionari allineati
        run: npm run check:locales
      # Ogni runAsPlatform e ogni pool.query nudo lato server porta il suo
      # «// rls-bypass: <motivo>»: un bypass nuovo senza motivazione ferma la
      # PR. È la classe dei guasti visti solo in produzione (print agent
      # 21/08, gate del nodo 16/09, cursore upstream 24/09).
      - name: Bypass RLS motivati
        run: npm run check:rls-bypass
      - name: Build frontend
        run: npm run build
      - name: Build server
        run: npm run build:server

  # Il nodo di sala gira sul Postgres del PC del locale (PostgreSQL 18 al
  # Frantoio), non su quello di Railway: il 06/10 una query del suo avvio
  # moriva solo lì (pg_get_serial_sequence valutata anche sulle tabelle di
  # sistema) e le sequenze del nodo non entravano nel suo spazio di id. Qui
  # i test del nodo su quella versione; orders-bills prima, perché accende
  # comande e conti per i file che seguono.
  api-tests-node-pg18:
    name: Test API nodo (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ristotest_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test del nodo su PostgreSQL 18 (build server + vitest)
        run: npm run build:server && npx vitest run tests/api/orders-bills.test.ts tests/api/sala-node

  # Il pacchetto del nodo di sala (fase A4b del piano «sala, comande e conto
  # sul nodo»): a ogni push su main la CI costruisce lo zip da appoggiare
  # nella inbox del supervisore sul PC del locale — niente da compilare sul
  # Mac, si scarica dagli artefatti della run. Le dipendenze di produzione
  # sono tutte JavaScript (bcryptjs, pg…): lo zip fatto qui su Linux gira
  # uguale su Windows e Mac. Non sulle PR: è un minuto in più per niente.
  node-package:
    name: Pacchetto del nodo di sala
    if: github.event_name != 'pull_request'
    needs: typecheck-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Costruisci lo zip
        run: npm run package:node -- --zip
        env:
          BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: sympotia-nodo-${{ github.sha }}
          path: build/nodo/sympotia-nodo-*.zip
          if-no-files-found: error
          retention-days: 30
      # Il pacchetto leggero dell'agente della cassa (un solo file, per chi
      # ha solo la cassa Passepartout), e il suo caricamento nel canale
      # pilota del cloud: i supervisori dei ristoranti in pilota lo
      # scaricano di notte. Lo stesso codice non diventa un rilascio nuovo
      # (il server confronta l'impronta). Il segreto AGENT_RELEASE_TOKEN è
      # lo stesso della variabile su Railway e apre solo quel caricamento;
      # senza, il caricamento si salta. Railway costruisce il
      # server in parallelo: finché la route nuova non risponde (404, 5xx)
      # si riprova, fino a 15 minuti.
      - name: Costruisci l'agente leggero
        run: npm run package:agent -- --zip
        env:
          BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: sympotia-agente-${{ github.sha }}
          path: build/agente/sympotia-agente-*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Carica l'agente nel canale pilota
        if: github.ref == 'refs/heads/main'
        env:
          AGENT_RELEASE_TOKEN: ${{ secrets.AGENT_RELEASE_TOKEN }}
          API_URL: ${{ vars.SYMPOTIA_API_URL || 'https://ristomanager-production.up.railway.app' }}
        run: |
          if [ -z "$AGENT_RELEASE_TOKEN" ]; then echo "AGENT_RELEASE_TOKEN non impostato: caricamento saltato"; exit 0; fi
          SHA="${GITHUB_SHA::7}"
          IMPRONTA=$(node -p "require('./build/agente/$SHA/build-info.json').contenuto_sha256")
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o risposta.json -w '%{http_code}' -X POST "$API_URL/admin/agent-releases" \
              -H "X-Agent-Release-Token: $AGENT_RELEASE_TOKEN" -H "Content-Type: application/zip" \
              -H "X-Release-Sha: $SHA" -H "X-Contenuto-Sha256: $IMPRONTA" \
              --data-binary "@build/agente/sympotia-agente-$SHA.zip" || true)
            case "$CODE" in
              200|201) cat risposta.json; echo; exit 0 ;;
              000|404|502|503|504) echo "tentativo $i: HTTP $CODE, riprovo"; sleep 30 ;;
              *) echo "caricamento rifiutato: HTTP $CODE"; cat risposta.json; echo; exit 1 ;;
            esac
          done
          echo "il server non ha accettato il pacchetto in 15 minuti"; exit 1

  # Il report AI (POST /reports/ai-summary) nella suite ordinaria risponde
  # 503 prima di leggere il DB, perché non c'è la chiave. Qui gira il solo
  # file che lo copre, con uno stub locale di Anthropic avviato dal test
  # stesso: nessuna chiamata esterna. Da superuser la RLS tace, quindi a
  # tenere fuori le sale di un altro tenant restano solo i filtri tenant_id
  # espliciti del report, ed è proprio ciò che il job prova (audit
  # isolamento M-03). Job a parte perché l'ambiente dello stub non deve
  # arrivare agli altri file: ai-report.test.ts si aspetta il 503.
  api-tests-ai-stub:
    name: Test API (report AI, stub locale)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ristotest_api
      TEST_AI_STUB: '1'
      ANTHROPIC_API_KEY: stub
      ANTHROPIC_BASE_URL: http://127.0.0.1:47649
      REPORTS_ADMIN_EMAILS: admin@ristomanager.com,platform.admin.contesto@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report AI nel tenant, assistente Aiuto, scheda cliente nei Messaggi, bolle HACCP e bozza della scheda food cost (build server + vitest sui file con lo stub)
        run: npm run build:server && npx vitest run tests/api/pannello-contesto.test.ts tests/api/assistente.test.ts tests/api/ai-scheda-cliente.test.ts tests/api/haccp-bolle.test.ts tests/api/food-cost-bozza.test.ts

  api-tests:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Il globalSetup droppa e ricrea questo database a ogni run.
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ristotest_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test API (build server + vitest)
        run: npm test

  # La stessa suite col server su un ruolo NON superuser e app.rls_strict
  # acceso, cioè come gira Railway: una query senza contesto vede zero righe
  # invece di tutte. Job separato e non matrice: il check «Test API» è fra
  # quelli obbligatori di main, e una matrice ne cambierebbe il nome.
  api-tests-strict:
    name: Test API (RLS rigida)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ristotest_api
      TEST_STRICT_RLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test API con RLS rigida (build server + vitest)
        run: npm test
